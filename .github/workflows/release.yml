# Builds the Windows installer for a published GitHub release and attaches it, with its SHA-256 in the notes,
# plus the Microsoft Store package (.appx) as a run artifact.
# Builds run here instead of locally: making an NSIS installer means running the fresh, unsigned setup exe once,
# which Smart App Control blocks on the developer's PC.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch: # builds only the Store package, to check it before a release

permissions:
  contents: write # upload the installer and edit the release notes

jobs:
  windows-installer:
    if: github.event_name == 'release'
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Tag must match package.json version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"

      - run: npm run dist

      - name: Attach installer and checksum to the release
        shell: bash
        run: |
          exe=$(ls dist/*.exe)
          name=$(basename "$exe" | tr ' ' '.')  # GitHub turns spaces in asset names into dots
          hash=$(sha256sum "$exe" | cut -d' ' -f1)
          gh release upload "$TAG" "$exe#Playdex Setup ${TAG#v} (Windows x64 installer)" --clobber
          {
            gh release view "$TAG" --json body --jq .body
            printf '\n\n## Verify the download\n```\nSHA-256  %s\n```\n' "$hash"
            printf 'In PowerShell: `Get-FileHash .\\%s` should print the same value.\n' "$name"
            printf '\nBuilt by GitHub Actions from tag `%s` (commit %s).\n' "$TAG" "$(git rev-parse --short HEAD)"
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md

  # The Store signs the package itself, so it stays unsigned here and Smart App Control allows the Store install.
  # Download it from the run's artifacts and upload it in Partner Center.
  store-package:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run dist:store

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playdex-store-package
          path: dist/*.appx
          if-no-files-found: error
