# Runs the unit and scanner tests on every push to main and on every pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest # the scanners read Windows launcher data and use Windows paths
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1 # tests don't start Electron; skips a ~100 MB download
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
