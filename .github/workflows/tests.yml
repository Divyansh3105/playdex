# Runs the unit and scanner tests on every push to main and on every pull request.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest # the scanners read Windows launcher data and use Windows paths
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1 # tests don't start Electron; skips a ~100 MB download
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
