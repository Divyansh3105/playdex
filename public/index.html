<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Playdex</title>
<style>
  :root {
    --bg: #0e1014; --panel: #171a21; --line: #262b36; --text: #e8eaf0; --muted: #8b93a7;
    --accent: #7c9cff; --ok: #4ade80;
    --steam: #66c0f4; --epic: #d6d6d6; --gog: #b77cff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; padding: 20px 24px 8px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
  #stats { color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  nav { position: sticky; top: 0; z-index: 2; display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
        padding: 12px 24px; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--line); }
  .tabs { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
  .tabs button { border: 0; background: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; color: var(--muted); }
  .tabs button[aria-selected="true"] { background: var(--line); color: var(--text); }
  .count { margin-left: 6px; padding: 0 6px; border-radius: 10px; background: var(--accent); color: #0b0d12; font-size: 12px; font-weight: 600; }
  input[type="search"] { flex: 1; min-width: 160px; max-width: 320px; padding: 7px 12px; border-radius: 8px;
                         border: 1px solid var(--line); background: var(--panel); }
  .chip { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 999px; cursor: pointer; color: var(--muted); }
  .chip[aria-pressed="true"] { color: var(--text); border-color: currentColor; }
  .chip.steam[aria-pressed="true"] { color: var(--steam); }
  .chip.epic[aria-pressed="true"] { color: var(--epic); }
  .chip.gog[aria-pressed="true"] { color: var(--gog); }
  label.toggle { display: flex; gap: 6px; align-items: center; color: var(--muted); cursor: pointer; }
  #rescan, #settings { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
  #rescan { margin-left: auto; }

  main { padding: 20px 24px 48px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 18px; }
  .card { position: relative; display: flex; flex-direction: column; gap: 8px; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
  .card img, .ph { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; border-radius: 8px; background: var(--panel);
                   border: 1px solid var(--line); transition: transform .15s ease, box-shadow .15s ease; }
  .ph { display: grid; place-items: center; padding: 12px; text-align: center; color: var(--muted); font-weight: 600;
        background: linear-gradient(160deg, #1d2230, #12151c); }
  .card:hover img, .card:hover .ph, .card:focus-visible img { transform: translateY(-3px); box-shadow: 0 10px 24px #0008; }
  .action { position: absolute; top: 8px; left: 8px; right: 8px; padding: 6px; border-radius: 6px; text-align: center;
            background: #000c; font-weight: 600; opacity: 0; transition: opacity .15s; }
  .card:hover .action, .card:focus-visible .action { opacity: 1; }
  .meta { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 4px; border: 1px solid currentColor; white-space: nowrap; background: none; }
  .badge.steam { color: var(--steam); } .badge.epic { color: var(--epic); } .badge.gog { color: var(--gog); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }

  .hint { color: var(--muted); margin: 0 0 16px; }
  .dups { display: grid; gap: 10px; max-width: 760px; }
  .dup { display: flex; gap: 14px; align-items: center; padding: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .dup img, .dup .ph { width: 48px; flex: none; font-size: 10px; padding: 2px; border-radius: 5px; }
  .dup h3 { margin: 0 0 6px; font-size: 15px; }
  .stores { display: flex; gap: 6px; flex-wrap: wrap; }
  .stores .badge { cursor: pointer; padding: 3px 9px; }
  .stores .badge.installed::before { content: "● "; color: var(--ok); }

  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  .errors { color: #fbbf24; margin: 0 0 16px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
           background: var(--panel); border: 1px solid var(--line); padding: 10px 16px; border-radius: 8px; transition: .2s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>Playdex</h1>
  <div id="stats"></div>
</header>
<nav>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-library" aria-selected="true">Library</button>
    <button role="tab" id="tab-dups" aria-selected="false">Duplicates<span class="count" id="dup-count">0</span></button>
  </div>
  <input type="search" id="q" placeholder="Search games…" aria-label="Search games">
  <div id="chips" style="display:flex;gap:6px"></div>
  <label class="toggle"><input type="checkbox" id="installed"> Installed only</label>
  <button id="rescan">Rescan</button>
  <button id="settings" title="Opens config.json, where you can add a Steam Web API key for an exact Steam library">Settings</button>
</nav>
<main id="view"></main>
<div id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
